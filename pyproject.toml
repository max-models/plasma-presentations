[build-system]
build-backend = "setuptools.build_meta"
requires = [ "setuptools", "wheel" ]

[project]
name = "plasma-presentations"
version = "0.1.0"
description = "Talks written as Quarto slides with the max-models look: HTML with reveal.js and PDF with Beamer from one source."
readme = "README.md"
keywords = [ "beamer", "presentation", "quarto", "revealjs", "science", "slides" ]
license.text = "MIT"
authors = [
  { email = "max.lindqvist@ipp.mpg.de", name = "Max Lindqvist" },
]
requires-python = ">=3.10"
classifiers = [
  "Development Status :: 3 - Alpha",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
]
# PyPI rejects direct references (name @ git+...), so only version ranges go here; the
# max-models packages come from their devel branches through [tool.uv.sources]
dependencies = [
  "scope-profiler>=0.7.5",
]
optional-dependencies.dev = [
  "jupyterlab",
  "pre-commit",
  "pyproject-fmt",
  "pyright",
  "ruff",
  "plasma-presentations[docs,test]",
]
optional-dependencies.docs = [
  "griffe",
  "plasma-presentations[figures]",
  "ipykernel",
  "matplotlib>=3.10.9",
  "nbclient>=0.11",
  "nbformat>=5.11.1",
]
# plasma_presentations.figure: plasma-plots figures for the plasma-figure shortcode
optional-dependencies.figures = [ "plasma-plots[plotly]" ]
optional-dependencies.test = [ "plasma-presentations[figures]", "pytest", "pytest-cov" ]
urls.Source = "https://github.com/max-models/plasma-presentations"
scripts.plasma-presentations = "plasma_presentations.main:main"

[tool.setuptools]
package-data."*" = [ "py.typed" ]
package-data.plasma_presentations = [ "_extensions/**/*", "templates/*" ]
packages.find.where = [ "src" ]

[tool.ruff]
target-version = "py310"
line-length = 88
extend-include = [ "*.ipynb" ]
# pycodestyle, pyflakes, isort, pyupgrade, bugbear and pydocstyle
lint.select = [ "B", "D", "E", "F", "I", "UP", "W" ]
lint.ignore = [ "E501" ]  # line length is handled by the formatter
lint.per-file-ignores."**/tests/**" = [ "D" ]
lint.per-file-ignores."*.ipynb" = [ "D" ]
lint.per-file-ignores."docs/tools/*" = [ "D" ]
lint.pydocstyle.convention = "google"

[tool.pyright]
include = [ "src" ]
exclude = [ "**/tests" ]
pythonVersion = "3.10"
typeCheckingMode = "standard"

[tool.pytest]
ini_options.pythonpath = [ "src" ]
ini_options.testpaths = [ "src" ]
ini_options.addopts = "-ra"

[tool.coverage]
run.omit = [ "*/tests/*" ]
run.source = [ "plasma_presentations" ]
report.fail_under = 95
report.show_missing = true

# PRs to devel test against the devel branches of the max-models packages (pinned in
# uv.lock); PRs to main and the release use PyPI only (CI sets UV_NO_SOURCES).
[tool.uv.sources]
# one entry per max-models package in [project], spelled exactly like this in every repo:
# cunumpy = { git = "https://github.com/max-models/cunumpy", branch = "devel" }
plasma-plots = { git = "https://github.com/max-models/plasma-plots", branch = "devel" }
scope-profiler = { git = "https://github.com/max-models/scope-profiler", branch = "devel" }
