name: Docs

# The Astro + Starlight site in docs/: hand-written pages, the executed notebooks and the API
# reference. Built on every push and pull request with the shared workflow of
# max-models/starlight-theme; deployed to GitHub Pages from devel.

on:
  push:
    branches: ["main", "devel"]
  pull_request:
    branches: ["main", "devel"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: docs-${{ github.ref }}
  cancel-in-progress: true

jobs:
  docs:
    uses: max-models/starlight-theme/.github/workflows/docs.yml@v0
    with:
      # the example scripts render their talks with Quarto (downloaded here) and lualatex, and
      # show the PDF's slides as PNGs (poppler)
      apt-packages: >-
        texlive-luatex texlive-latex-recommended texlive-latex-extra lmodern poppler-utils
      pre-build: >-
        curl -sSL -o /tmp/quarto.tar.gz
        https://github.com/quarto-dev/quarto-cli/releases/download/v1.6.40/quarto-1.6.40-linux-amd64.tar.gz &&
        tar -xzf /tmp/quarto.tar.gz -C /tmp &&
        QUARTO_PATH=/tmp/quarto-1.6.40/bin/quarto uv run python docs/tools/examples.py
      smoke-paths: |
        getting-started/installation/index.html
        examples/index.html
        example-scripts/index.html
        example-scripts/first-talk/index.html
        api/plasma_presentations/index.html
        api/plasma_presentations/main/index.html
        api/plasma_presentations/talk/index.html
        example-scripts/first-talk/plot-1.png
